name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Verify Build
    permissions:
      contents: read
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      deploy: false
