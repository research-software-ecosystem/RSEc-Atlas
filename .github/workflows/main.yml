name: Deploy Static Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Get latest commit hash of content repo
      id: content-hash
      run: |
        HASH=$(gh api repos/research-software-ecosystem/content/commits/master --jq '.sha')
        echo "hash=$HASH" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Restore content from cache
      id: cache-content
      uses: actions/cache@v4
      with:
        path: backend/content
        key: content-${{ steps.content-hash.outputs.hash }}

    - name: Checkout content repository
      if: steps.cache-content.outputs.cache-hit != 'true'
      uses: actions/checkout@v5
      with:
        repository: research-software-ecosystem/content
        path: backend/content

    - name: Install Python dependencies
      run: uv pip install --system -r backend/requirements.txt

    - name: Install Node.js dependencies
      working-directory: frontend
      run: npm ci
      env:
        NUXT_TELEMETRY_DISABLED: 1

    - name: Generate combined metadata JSON file
      run: python backend/merge_data_files.py

    - name: Generate static site
      working-directory: frontend
      run: npm run generate
      env:
        NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: frontend/.output/public
        force_orphan: true
        keep_files: false
